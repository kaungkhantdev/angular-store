<section class="py-6">
<!--  search and filter -->
  <div class="py-4">
    <div>
      <p-iconfield>
        <p-inputicon>
          <svg data-p-icon="search" />
        </p-inputicon>
        <input type="text" pInputText placeholder="Search" />
      </p-iconfield>
    </div>
  </div>

<!--  cards-->
  <div class="grid lg:grid-cols-4 gap-x-4 gap-y-6 md:grid-cols-2 grid-cols-1">
    @for ( item of items; track item) {
      <div class="flex justify-center">
        <div class="max-w-sm w-full space-y-2">
          <div>
            <div class="relative">
              <img
                class="w-full max-h-80 rounded"
                alt="user header"
                src="https://images.unsplash.com/photo-1789237523831-8cd17bcd00b2?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              />
            </div>
          </div>
          <div>
            <span class="font-bold">Sakura Fresh Market</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <p-tag severity="info" value="Daily" />
              <p-tag severity="info" value="Premium" />
            </div>
          </div>
          <div class="space-y-4">
            <p class="text-sm">Sakura Fresh Market store for fresh local produce!</p>
            <div class="flex items-center gap-2">
              <span>$ 320 </span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
<!--  pagination -->
  <div class="flex justify-end pt-4">
    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="120" [rowsPerPageOptions]="[10, 20, 30]" />
  </div>
</section>
